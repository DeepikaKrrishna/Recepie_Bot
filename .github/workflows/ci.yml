name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (AI provider mocked, network blocked)
        env:
          OPENROUTER_API_KEY: ""
        run: pytest
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: App boots without secrets
        run: python -c "from main import app; print('ok', app.title)"

  postgres:
    name: Tests on PostgreSQL 16 + migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recipebot
          POSTGRES_PASSWORD: recipebot
          POSTGRES_DB: recipebot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipebot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://recipebot:recipebot@localhost:5432/recipebot_test
      DATABASE_URL: postgresql://recipebot:recipebot@localhost:5432/recipebot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests against PostgreSQL
        run: pytest
      - name: Migrations upgrade, downgrade and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  e2e:
    name: Browser journeys + accessibility
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Install Playwright + axe
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Start app with fake AI provider
        run: |
          DATABASE_URL=sqlite:///./e2e.sqlite3 PORT=8000 python scripts/run_mock_server.py &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: Journeys (desktop + mobile) and axe scan
        working-directory: e2e
        run: |
          mkdir -p screenshots
          npm test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
